# Deploy: fly launch --copy-config --no-deploy && fly deploy
app = "tilt-controller-relay"
primary_region = "bom"   # Mumbai, closest to central India

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # a sleeping machine adds seconds to the first connect
  min_machines_running = 1

  [[http_service.checks]]
    path = "/health"
    interval = "15s"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
